name: Release

# Every published package in packages/ goes out together, under one version number, after CI is green on main.
#
# Two switches, both repository variables (Settings > Secrets and variables > Actions > Variables):
#   NPM_PUBLISH=true   tag, publish to npm and create the GitHub release.
#   anything else      a dry run: version, build and pack everything, upload the tarballs, touch nothing outside.
# The dry run is what keeps main green before npm is set up, and it still proves on every push that the whole set
# can be built and packed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # For the first release after NPM_PUBLISH is switched on, or to finish one that stopped halfway.
  workflow_dispatch:

# One release at a time. A run that is waiting is replaced by a newer one; a run that is publishing is left alone.
concurrency:
  group: release
  cancel-in-progress: false

# See ci.yml: Nx plugin workers time out on cold runners unless they load in-process.
env:
  NX_ISOLATE_PLUGINS: "false"

jobs:
  gate:
    name: Is this commit the tip of main?
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    outputs:
      release: ${{ steps.tip.outputs.release }}
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      # Only the commit CI just verified is released, and only while it is still the newest one on main. A re-run
      # of an old CI run would otherwise build an old tree and publish it under the newest version number.
      - name: Compare with main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TIP="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          echo "sha=${VERIFIED}" >> "$GITHUB_OUTPUT"
          if [ "$TIP" = "$VERIFIED" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERIFIED} is not the tip of main (${TIP}). The run for the tip releases instead."
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.release == 'true'
    timeout-minutes: 30
    permissions:
      # Pushing the tag and creating the GitHub release.
      contents: write
      # npm authenticates the publish through trusted publishing: pnpm exchanges this job's OIDC id token with the
      # registry. No npm token is stored anywhere. Each package names this workflow file (release.yml) and this
      # environment (npm) as its trusted publisher on npmjs.com.
      id-token: write
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Every tag and the whole history: nx reads both to work out the next version.
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
          # Pushing a new tag works with the default GITHUB_TOKEN (contents: write).
          # Set RELEASE_TOKEN only if you also protect tags and need a bypass.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # nx works out the next version from the conventional commits since the last v* tag and writes it into every
      # package.json of the fixed group in nx.json. It does not touch git: its own git stage is skipped silently in
      # CI, so the tag is pushed by hand below, and that tag is what makes the next run resolve forward.
      #
      # Version runs before the build, so anything a build reads from package.json gets the new number.
      #
      # Before the first v* tag exists nx has nothing to count from and makes no bump, so the first release goes
      # out at the version already in the package.json files. Set that number by hand, in all of them, if the
      # first release should be something other than what is on disk.
      - name: Version
        run: pnpm nx release version
      # nx only writes package.json when the commits since the last tag call for a bump. On a run with nothing to
      # bump (a `ci:` or `chore:` push) the files keep their placeholder, and the gate below would compare the wrong
      # version with npm. The latest v* tag is the version the packages ARE in that case, so put it back on disk.
      #
      # Then the rule the whole release stands on: every published package carries the same version.
      - name: Reconcile with the latest tag and agree on one version
        id: version
        run: |
          DISK="$(node .github/scripts/packages.mjs check)"
          if [ -z "$DISK" ]; then
            echo "::notice::Nothing to release: no package in packages/ is published yet."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')"
          NEWEST="$(printf '%s\n%s\n' "$LATEST" "$DISK" | sort -V | tail -1)"
          if [ -n "$LATEST" ] && [ "$NEWEST" != "$DISK" ]; then
            echo "nx made no bump; package.json says ${DISK}, latest tag is v${LATEST}. Using ${LATEST}."
            node .github/scripts/packages.mjs set-version "$LATEST"
          else
            echo "Version on disk: ${DISK}"
          fi
          VERSION="$(node .github/scripts/packages.mjs check)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}:"
          node .github/scripts/packages.mjs list
      - name: Build the packages
        if: steps.version.outputs.version != ''
        run: pnpm --filter "./packages/*" build
      # All or none. Every package is packed before the first one is published, and each tarball is opened and
      # checked: the entry file package.json points at is inside, and no `workspace:` range survived into the
      # manifest people will install. A package that cannot be packed stops the run here, with nothing on npm yet.
      - name: Pack every package
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT="${RUNNER_TEMP}/tarballs"
          mkdir -p "$OUT"
          # The list is read on descriptor 3, so nothing inside the loop (pnpm, tar, node) can swallow the rest of
          # it from stdin and quietly end the loop after the first package.
          while IFS=$'\t' read -r DIR NAME _ <&3; do
            (cd "$DIR" && pnpm pack --pack-destination "$OUT" >/dev/null)
            TARBALL="${OUT}/$(printf '%s' "${NAME#@}" | tr '/' '-')-${VERSION}.tgz"
            if [ ! -f "$TARBALL" ]; then
              echo "::error::${NAME} did not pack to ${TARBALL}"
              ls -l "$OUT"
              exit 1
            fi
            MAIN="$(node -p "(require('./${DIR}/package.json').main || '').replace(/^\.\//, '')")"
            if [ -n "$MAIN" ] && ! tar -tzf "$TARBALL" | grep -qx "package/${MAIN}"; then
              echo "::error::${NAME} packed without its entry file ${MAIN}. Did the build run?"
              tar -tzf "$TARBALL"
              exit 1
            fi
            if tar -xOzf "$TARBALL" package/package.json | grep -q '"workspace:'; then
              echo "::error::${NAME} packed with a workspace: range still in its package.json"
              exit 1
            fi
            echo "packed ${NAME}@${VERSION} ($(tar -tzf "$TARBALL" | wc -l | tr -d ' ') files)"
          done 3< <(node .github/scripts/packages.mjs list)
          ls -l "$OUT"
      # What a dry run leaves behind: download it from the run's page to see exactly what would go to npm.
      - name: Upload the tarballs
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/tarballs/*.tgz
          retention-days: 14
          if-no-files-found: error
      - name: Stop here unless publishing is switched on
        if: steps.version.outputs.version != '' && vars.NPM_PUBLISH != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::Dry run. v${VERSION} was built and packed, nothing was tagged or published. Set the repository variable NPM_PUBLISH to true to release."
      # The tag guards the version bump: nx resolves the next version from it, so it is pushed before anything is
      # published. It is not pushed on a dry run, or every push to main would burn a version number nobody can
      # install.
      - name: Tag the release
        if: steps.version.outputs.version != '' && vars.NPM_PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already on origin."
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi
      # The tag and the npm publish are two separate facts, and they can drift: a publish that fails after the tag
      # was pushed leaves the tag with nothing behind it. So the question asked per package is "is this version on
      # npm", never "does the tag exist". A run that stopped after one of the two packages is finished by running
      # the workflow again: the first is skipped, the other is published.
      - name: Publish to npm
        if: steps.version.outputs.version != '' && vars.NPM_PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Trusted publishing turns provenance on by default, and npm only accepts sigstore attestations from
          # public source repositories: from a private one the publish is rejected with a 422. Off while this
          # repository is private, left at the default once it is public.
          if [ "$REPO_PRIVATE" = "true" ]; then
            export npm_config_provenance=false
          fi
          # Asks the registry whether this exact version of a package is up. Prints "yes", "no" or "unknown".
          # Some npm versions answer a missing version with an error (E404), others with exit 0 and no output,
          # so both count as "no". Anything else (the registry is down, the network dropped) says nothing about
          # what is on npm and is "unknown".
          on_npm() {
            local out status
            out="$(npm view "$1@${VERSION}" version 2>&1)" && status=0 || status=$?
            if [ "$status" -eq 0 ] && printf '%s\n' "$out" | grep -qxF "$VERSION"; then
              echo yes
            elif [ "$status" -eq 0 ] || printf '%s' "$out" | grep -q "E404"; then
              echo no
            else
              printf '%s\n' "$out" >&2
              echo unknown
            fi
          }
          PUBLISHED=0
          while IFS=$'\t' read -r DIR NAME _ <&3; do
            case "$(on_npm "$NAME")" in
              yes)
                echo "${NAME}@${VERSION} is already on npm; skipping."
                continue
                ;;
              unknown)
                echo "::error::Could not ask npm about ${NAME}@${VERSION}, so nothing more is published in this run."
                exit 1
                ;;
            esac
            echo "Publishing ${NAME}@${VERSION}"
            # nx's release-publish wrapper builds a --<scope>:registry flag pnpm's native CLI rejects, so pnpm is
            # called directly, from the package's own directory.
            (cd "$DIR" && pnpm publish --access public --no-git-checks --tag latest)
            PUBLISHED=$((PUBLISHED + 1))
          done 3< <(node .github/scripts/packages.mjs list)
          echo "Published ${PUBLISHED} packages at ${VERSION}."
          # A publish command that exits 0 is a claim. The registry is asked for every package before the release
          # is announced; it can take a moment to show a new version, so each one gets a minute.
          while IFS=$'\t' read -r _ NAME _ <&3; do
            for ATTEMPT in 1 2 3 4 5 6; do
              if [ "$(on_npm "$NAME" 2>/dev/null)" = "yes" ]; then
                echo "confirmed ${NAME}@${VERSION}"
                continue 2
              fi
              sleep 10
            done
            echo "::error::${NAME}@${VERSION} is still not on npm. Run this workflow again to publish what is missing."
            exit 1
          done 3< <(node .github/scripts/packages.mjs list)
      # Reached only when the registry has confirmed every package of this version. Created once: a later run for
      # the same version (a `chore:` push that bumps nothing) finds the release and leaves it alone.
      - name: Create GitHub release
        if: steps.version.outputs.version != '' && vars.NPM_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --verify-tag
          fi
